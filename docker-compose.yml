x-data-service: &data-service
  image: ez-dk-citizen-data:local
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-}
    DATA_SERVICE_TOKEN: ${DATA_SERVICE_TOKEN:-}
    PORT: 3000

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    <<: *data-service
    build:
      context: .
      dockerfile: apps/data/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - node
      - dist/src/db/migrate.js

  hono-data:
    <<: *data-service
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/ready').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  bff:
    image: ez-dk-citizen-bff:local
    build:
      context: .
      dockerfile: apps/bff/Dockerfile
    environment:
      DATA_SERVICE_URL: http://hono-data:3000
      DATA_SERVICE_TIMEOUT_MS: ${DATA_SERVICE_TIMEOUT_MS:-2000}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      DATA_SERVICE_TOKEN: ${DATA_SERVICE_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      PORT: 3000
    depends_on:
      hono-data:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/ready').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  postgres-check:
    <<: *data-service
    profiles:
      - integration
    depends_on:
      hono-data:
        condition: service_healthy
    command:
      - node
      - dist/src/db/verify-postgres-foundation.js

  postgres-test:
    <<: *data-service
    profiles:
      - integration
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - npm
      - run
      - test:compiled

  migration-failure:
    <<: *data-service
    profiles:
      - integration-failure
    environment:
      MIGRATIONS_FOLDER: /app/test-fixtures/broken-migrations
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - node
      - dist/src/db/migrate.js

  data-after-failed-migration:
    <<: *data-service
    profiles:
      - integration-failure
    depends_on:
      migration-failure:
        condition: service_completed_successfully
    command:
      - node
      - dist/src/index.js

volumes:
  postgres_data:
