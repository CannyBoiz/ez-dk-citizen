x-database-url: &database-url postgresql://${POSTGRES_USER:-}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-}

x-backend-image: &backend-image
  image: ez-dk-citizen-backend:local
  build:
    context: .
    dockerfile: apps/backend/Dockerfile

# The data package's one-shot commands, run from the Backend image. They receive the
# database and nothing else: no AWS profile and no identity mounts.
x-data-command: &data-command
  <<: *backend-image
  working_dir: /app/node_modules/@ez-dk-citizen/data
  environment:
    DATABASE_URL: *database-url

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    <<: *data-command
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - node
      - dist/src/db/migrate.js

  backend:
    <<: *backend-image
    environment: &backend-environment
      DATABASE_URL: *database-url
      DATABASE_TIMEOUT_MS: ${DATABASE_TIMEOUT_MS:-2000}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/ready').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  postgres-check:
    <<: *data-command
    profiles:
      - integration
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - node
      - dist/src/db/verify-postgres-foundation.js

  postgres-test:
    <<: *data-command
    profiles:
      - integration
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - npm
      - run
      - test:compiled

  backend-test:
    <<: *backend-image
    profiles:
      - integration
    environment:
      DATABASE_URL: *database-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - npm
      - run
      - test:compiled

  migration-failure:
    <<: *data-command
    profiles:
      - integration-failure
    environment:
      DATABASE_URL: *database-url
      MIGRATIONS_FOLDER: test-fixtures/broken-migrations
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - node
      - dist/src/db/migrate.js

  backend-after-failed-migration:
    <<: *backend-image
    profiles:
      - integration-failure
    environment: *backend-environment
    depends_on:
      migration-failure:
        condition: service_completed_successfully

volumes:
  postgres_data:
