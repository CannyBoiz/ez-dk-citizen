x-data-service: &data-service
  image: ez-dk-citizen-data:local
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    <<: *data-service
    build:
      context: .
      dockerfile: apps/data/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - node
      - dist/src/db/migrate.js

  hono-data:
    <<: *data-service
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/ready').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  postgres-check:
    <<: *data-service
    profiles:
      - integration
    depends_on:
      hono-data:
        condition: service_healthy
    command:
      - node
      - dist/src/db/verify-postgres-foundation.js

  postgres-test:
    <<: *data-service
    profiles:
      - integration
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - npm
      - run
      - test:compiled

  migration-failure:
    <<: *data-service
    profiles:
      - integration-failure
    environment:
      MIGRATIONS_FOLDER: /app/test-fixtures/broken-migrations
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - node
      - dist/src/db/migrate.js

  data-after-failed-migration:
    <<: *data-service
    profiles:
      - integration-failure
    depends_on:
      migration-failure:
        condition: service_completed_successfully
    command:
      - node
      - dist/src/index.js

volumes:
  postgres_data:
